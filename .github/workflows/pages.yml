name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the engine wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile the explorer
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Assemble the site
        run: python scripts/build_site.py web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
